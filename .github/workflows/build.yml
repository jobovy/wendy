name: build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 20 * * 2'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12","3.13"]
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHON_COVREPORTS_VERSION: "3.13"
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install lcov
      if: runner.os == 'Linux'
      run: |
         wget https://github.com/linux-test-project/lcov/releases/download/v1.15/lcov-1.15.tar.gz
         tar xf lcov-1.15.tar.gz
         sudo make -C lcov-1.15/ install
    - name: Install package
      run: |
        export CFLAGS="-D PARALLEL_SERIAL_SORT_SWITCH=10 -D PARALLEL_SERIAL_MERGE_SWITCH=10 -D PARALLEL_SORT_NUM_THREADS=2"
        pip install .
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install setuptools
          python setup.py build_ext --coverage --inplace
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
        fi
    - name: Test with pytest
      run: |
        pip install pytest-cov
        if [ "$RUNNER_OS" == "Linux" ]; then
          pytest -v tests/ --cov wendy --cov-config .coveragerc --cov-report=term --cov-report=xml
        else
          pytest -v tests/
        fi
    - name: Generate code coverage
      if: ${{ runner.os == 'Linux' && matrix.python-version == env.PYTHON_COVREPORTS_VERSION }}
      run: |
        BUILD_DIR=$(find build -type d -name "wendy" -path "build/temp.*/wendy" | head -n 1)
        if [ -z "$BUILD_DIR" ]; then 
          echo "Error: wendy build directory not found"
          echo "Available build directories:"
          find build -type d 2>/dev/null || echo "No build directories found"
          exit 1
        fi
        lcov --capture --base-directory . --directory "$BUILD_DIR" --no-external --output-file coverage_full.info
    - name: Upload coverage reports to codecov
      if: ${{ runner.os == 'Linux' && matrix.python-version == env.PYTHON_COVREPORTS_VERSION }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
